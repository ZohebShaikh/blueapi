name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Keep releases coming from the canonical repo only, mirroring the
    # forked-repo guard used by publish.yml.
    if: github.repository == 'DiamondLightSource/blueapi'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
