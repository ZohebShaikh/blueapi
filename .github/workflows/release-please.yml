# Keeps a release PR open that bumps the version and updates CHANGELOG.md from
# Conventional Commits on main. Merging it tags the release, and that tag push
# runs ci.yml to publish to PyPI, ghcr.io (container + helm) and attach docs.
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Must not be GITHUB_TOKEN: tags/PRs it creates do not trigger other
          # workflows, so ci.yml would never publish the release or test the PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
